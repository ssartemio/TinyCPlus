name: TinyC+ verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc
          - os: ubuntu-24.04-arm
            cc: gcc
          - os: macos-15
            cc: clang
          - os: macos-15-intel
            cc: clang
          - os: windows-2025
            cc: gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configure Windows compiler path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidate = 'C:\msys64\mingw64\bin'
          if (Test-Path "$candidate\gcc.exe") { $candidate | Out-File -FilePath $env:GITHUB_PATH -Append }
      - run: python tools/bootstrap.py --cc ${{ matrix.cc }}
      - run: python build.py --cc ${{ matrix.cc }}
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/run_all.py --cc ${{ matrix.cc }} --fuzz 1000
      - name: Install native X11 test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev xvfb xauth
      - name: Native X11 windows
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/test_gui_native.py --cc ${{ matrix.cc }}
      - name: Native desktop windows
        if: runner.os != 'Linux'
        run: python tests/test_gui_native.py --cc ${{ matrix.cc }}
      - name: Rebuild frontend with TinyCC
        run: python build.py
      - run: python tests/test_compiler.py --fuzz 1000
      - name: Build complete native distribution
        run: python tools/package.py --output-dir build/artifacts
      - name: Validate shipping archives outside the checkout
        shell: bash
        run: |
          for archive in build/artifacts/*.zip build/artifacts/*.tar.gz; do
            if [ -f "$archive" ]; then python tests/test_distribution.py --archive "$archive"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tinycplus-${{ runner.os }}-${{ runner.arch }}
          path: build/artifacts/*
          if-no-files-found: error
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/bootstrap.py --cc clang
      - run: python build.py --cc clang --sanitize
      - run: python tests/test_compiler.py --fuzz 1000 --cc clang
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
      - run: clang -std=c11 -D_POSIX_C_SOURCE=200809L -fsanitize=address,undefined -g tests/runtime_concurrent.c -pthread -o build/concurrent-asan
      - run: ./build/concurrent-asan
      - run: clang -std=c11 -D_POSIX_C_SOURCE=200809L -fsanitize=address,undefined -g tests/runtime_network.c -pthread -lm -o build/network-asan
      - run: ./build/network-asan
      - run: clang -std=c11 -D_POSIX_C_SOURCE=200809L -fsanitize=address,undefined -g tests/runtime_tui.c -lm -o build/tui-asan
      - run: ./build/tui-asan
      - run: clang -std=c11 -D_POSIX_C_SOURCE=200809L -fsanitize=address,undefined -g tests/runtime_review.c -pthread -lm -o build/review-asan
      - run: ./build/review-asan
      - run: clang -std=c11 -D_POSIX_C_SOURCE=200809L -fsanitize=address,undefined -g tests/runtime_gui.c -lm -o build/gui-asan
      - run: ./build/gui-asan
