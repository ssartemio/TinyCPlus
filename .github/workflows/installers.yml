name: TinyC+ native installers
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [feature/native-installers]
    tags: ['v*']
  pull_request:
    paths:
      - 'tools/build_installers.py'
      - 'tests/test_windows_console.py'
      - 'tests/test_linux_install.sh'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY.md'
      - 'packaging/**'
      - '.github/workflows/installers.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Provision MinGW x64 via MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Compile TinyC+ and TinyEdit
        shell: msys2 {0}
        run: |
          python tools/bootstrap.py --cc gcc
          python build.py --cc gcc
          ./bin/tiny.exe build apps/tinyedit.tc -o bin/tinyedit.exe --cc gcc
      - name: Provision installer builder
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer with the same compiler environment
        shell: msys2 {0}
        run: |
          python tools/build_installers.py stage --target windows
          python tools/build_installers.py windows
      - name: Verify packaged imports and toolchain notices
        shell: msys2 {0}
        run: |
          set -euo pipefail
          for binary in build/installers/payload/bin/*.exe build/installers/payload/third_party/tcc/tcc.exe build/installers/payload/third_party/tcc/libtcc.dll; do
            objdump -p "$binary" > imports.txt
            imports=$(sed -n 's/.*DLL Name: //p' imports.txt | tr -d '\r' | tr '[:upper:]' '[:lower:]')
            test -n "$imports"
            printf '%s: %s\n' "$binary" "$imports"
            if printf '%s\n' "$imports" | grep -Ev '^(kernel32|msvcrt|user32|advapi32|ws2_32|shell32|ole32|bcrypt|ucrtbase)\.dll$|^api-ms-win-.*\.dll$'; then
              echo 'Unexpected non-system DLL dependency' >&2
              exit 1
            fi
          done
          test -s build/installers/payload/third_party/mingw-runtime/COPYING.MinGW-w64-runtime.txt
          test -s build/installers/payload/third_party/mingw-runtime/COPYING.RUNTIME
          test -s build/installers/payload/third_party/mingw-runtime/COPYING3
      - name: Install + smoke test + uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $items = @(Get-ChildItem dist -Filter '*.exe')
          if ($items.Count -ne 1) { throw 'Expected one installer' }
          $target = Join-Path $env:RUNNER_TEMP 'TinyCPlus Smoke'
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$target`"",'/TASKS=!addtopath')
          $p = Start-Process -FilePath $items[0].FullName -ArgumentList $args -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install error $($p.ExitCode)" }
          & "$target\bin\tiny.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'version smoke failed' }
          & "$target\bin\tiny.exe" run "$target\examples\hello.tc"
          if ($LASTEXITCODE -ne 0) { throw 'run smoke failed' }
          & "$target\bin\tinyc.exe" check "$target\examples\hello.tc"
          if ($LASTEXITCODE -ne 0) { throw 'check smoke failed' }
          python tests/test_windows_console.py "$target"
          if ($LASTEXITCODE -ne 0) { throw 'console smoke failed' }
          $shortcutPath = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\TinyC+\TinyC+ console.lnk'
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
          if ($shortcut.WorkingDirectory -ne $target) { throw 'Console shortcut has the wrong working directory' }
          if ($shortcut.Arguments -ne ('/K ""' + $target + '\bin\tiny-console.cmd""')) { throw 'Console shortcut has the wrong startup command' }
          foreach ($notice in @('LICENSE','NOTICE','THIRD_PARTY.md')) {
            if (-not (Test-Path (Join-Path $target $notice))) { throw "Missing $notice" }
          }
          $uninstaller = Join-Path $target 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $p = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/NORESTART') -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall error $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: tinycplus-windows-x64-installer
          path: dist/*.exe
          if-no-files-found: error
  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile TinyC+ and TinyEdit
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make dpkg-dev patchelf
          python tools/bootstrap.py --cc gcc
          python build.py --cc gcc
          ./bin/tiny build apps/tinyedit.tc -o bin/tinyedit --cc gcc
      - name: Build Debian package
        run: |
          python tools/build_installers.py stage --target linux
          python tools/build_installers.py deb
          dpkg-deb --info dist/*.deb
      - name: Install and test in a clean Ubuntu container
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" \
            -v "$PWD/tests/test_linux_install.sh:/test-install.sh:ro" \
            ubuntu:24.04 sh -c 'sh /test-install.sh deb /packages/*.deb'
      - uses: actions/upload-artifact@v4
        with:
          name: tinycplus-debian-amd64
          path: dist/*.deb
          if-no-files-found: error
  fedora:
    runs-on: ubuntu-24.04
    container:
      image: fedora:42
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: dnf install -y python3 gcc make rpm-build rpm glibc-devel git tar gzip patchelf
      - name: Compile TinyC+ and TinyEdit
        run: |
          python3 tools/bootstrap.py --cc gcc
          python3 build.py --cc gcc
          ./bin/tiny build apps/tinyedit.tc -o bin/tinyedit --cc gcc
      - name: Build Fedora package
        run: |
          python3 tools/build_installers.py stage --target linux
          python3 tools/build_installers.py rpm
          rpm -qpi dist/*.rpm
      - name: Install + smoke test + uninstall
        run: |
          dnf install -y dist/*.rpm
          tiny --version
          tiny check /usr/lib/tinycplus/examples/hello.tc
          tiny run /usr/lib/tinycplus/examples/hello.tc
          tinyc check /usr/lib/tinycplus/examples/hello.tc
          test -x /usr/bin/tinyedit
          dnf remove -y tinycplus
      - uses: actions/upload-artifact@v4
        with:
          name: tinycplus-fedora-x86_64
          path: dist/*.rpm
          if-no-files-found: error
  fedora-clean:
    needs: fedora
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: tinycplus-fedora-x86_64
          path: dist
      - name: Install and test in a clean Fedora container
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" \
            -v "$PWD/tests/test_linux_install.sh:/test-install.sh:ro" \
            fedora:42 sh -c 'sh /test-install.sh rpm /packages/*.rpm'
